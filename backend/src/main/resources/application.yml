spring:
  application:
    name: clrms-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/clrms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Hani}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
server:
  port: 8080
app:
  seed-demo-data: ${SEED_DEMO_DATA:${APP_SEED_DEMO_DATA:true}}
  seed-password: ${SEED_PASSWORD:${APP_SEED_PASSWORD:Demo@12345}}
  mail:
    from: ${MAIL_FROM:no-reply@clrms.local}
  notification:
    default-email: ${NOTIFICATION_DEFAULT_EMAIL:}
    staff-user-ids: ${NOTIFICATION_STAFF_USER_IDS:}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  storage-dir: ${STORAGE_DIR:${user.dir}/uploads}
  jwt:
    secret: ${JWT_SECRET:clrms-dev-secret-key-change-me-2026-minimum-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
